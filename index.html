<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistente Psicopedagógico</title>
<style>
    body { font-family: sans-serif; background: #f4f7f6; padding: 15px; color: #333; margin: 0; }
    .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .btn-menu { width: 100%; padding: 15px; margin: 8px 0; background: #2c3e50; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1em; text-align: center; box-sizing: border-box; }
    textarea, input, select { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1em; }
    .historial-card { border-left: 5px solid #27ae60; padding: 12px; background: #f9f9f9; margin: 10px 0; position: relative; border-radius: 4px; }
    .btn-delete { background: #e74c3c; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 3px; font-size: 0.85em; }
    .turno-box { background: #eef2f3; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #d1d8e0; }
    .grid-turnos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    #file-input { display: none; }
</style>
</head>
<body> 

<div class="container">
    <div id="nav-menu">
        <h1>Ámbito de Trabajo (Diagnóstico Tablet)</h1>
        <!-- CHIP DE ESTADO DE DATOS -->
        <div id="estado-datos" style="background:#e8f8f5; border:1px solid #1abc9c; padding:10px; margin-bottom:15px; border-radius:5px; font-weight:bold; color:#16a085;">
            Cargando estado de memoria...
        </div>

        <button class="btn-menu" onclick="iniciarModulo('ESCUELA')">🏫 ESCUELA</button>
        <button class="btn-menu" onclick="iniciarModulo('EIPRI')">👶 EIPRI</button>
        <button class="btn-menu" style="background:#16a085" onclick="iniciarMenuHospital()">🏥 HOSPITAL (Agenda y Consultorio)</button>
        <hr>
        <button class="btn-menu" style="background:#8e44ad" onclick="document.getElementById('file-input').click()">📂 CARGAR RESPALDO</button>
        <input type="file" id="file-input" accept=".json" onchange="cargarRespaldo(event)">
        <button class="btn-menu" style="background:#d35400" onclick="exportarRespaldo()">DESCARGAR RESPALDO GENERAL</button>
    </div> 

    <div id="hospital-dias" style="display:none;">
        <button onclick="location.reload()">⬅ Volver al Menú Principal</button>
        <h2>🏥 Agenda Hospital - Seleccioná el Día</h2>
        <button class="btn-menu" onclick="abrirDia('Lunes')">📅 LUNES</button>
        <button class="btn-menu" onclick="abrirDia('Martes')">📅 MARTES</button>
        <button class="btn-menu" onclick="abrirDia('Miercoles')">📅 MIÉRCOLES</button>
        <button class="btn-menu" onclick="abrirDia('Jueves')">📅 JUEVES</button>
    </div> 

    <div id="hospital-turnos-view" style="display:none;">
        <button onclick="iniciarMenuHospital()">⬅ Volver a Días</button>
        <h2 id="titulo-dia"></h2>
        <div id="contenedor-6-turnos"></div>
    </div> 

    <div id="work-area-general" style="display:none;">
        <button onclick="location.reload()">⬅ Volver</button>
        <h2 id="titulo-ambito-gen"></h2> 
        <h3>📂 Historial:</h3>
        <div id="lista-historial-gen"></div>
    </div>
</div> 

<script>
    let db = JSON.parse(localStorage.getItem('psico_db') || '[]');
    let agendaHospital = JSON.parse(localStorage.getItem('psico_agenda') || '{}');
    let listaEsperaData = localStorage.getItem('psico_espera') || '';
    let exPacientesDb = JSON.parse(localStorage.getItem('psico_ex') || '[]');

    let ambitoActual = '';
    let diaActual = '';

    function actualizarIndicadorEstado() {
        let totalPacientes = db.length;
        let totalDiasConAgenda = Object.keys(agendaHospital).length;
        document.getElementById('estado-datos').innerHTML = 
            `📊 Memoria actual en Tablet:<br>` +
            `- Pacientes en DB general/historial: ${totalPacientes}<br>` +
            `- Días con agenda guardada: ${totalDiasConAgenda}`;
    }
    
    // Ejecutar al iniciar
    actualizarIndicadorEstado();

    const StorageService = {
        guardarTodo() {
            localStorage.setItem('psico_db', JSON.stringify(db));
            localStorage.setItem('psico_agenda', JSON.stringify(agendaHospital));
            localStorage.setItem('psico_espera', listaEsperaData);
            localStorage.setItem('psico_ex', JSON.stringify(exPacientesDb));
        }
    };

    window.iniciarModulo = function(ambito) {
        ambitoActual = ambito;
        document.getElementById('nav-menu').style.display = 'none';
        document.getElementById('work-area-general').style.display = 'block';
        document.getElementById('titulo-ambito-gen').innerText = "Ámbito: " + ambito;
        renderizarHistorialGen();
    };

    window.iniciarMenuHospital = function() {
        document.getElementById('nav-menu').style.display = 'none';
        document.getElementById('hospital-turnos-view').style.display = 'none';
        document.getElementById('hospital-dias').style.display = 'block';
    };

    window.abrirDia = function(dia) {
        diaActual = dia;
        document.getElementById('hospital-dias').style.display = 'none';
        document.getElementById('hospital-turnos-view').style.display = 'block';
        document.getElementById('titulo-dia').innerText = "Turnos del Día: " + dia;
        renderizarTurnosDia();
    };

    function renderizarTurnosDia() {
        let cont = document.getElementById('contenedor-6-turnos');
        if (!agendaHospital[diaActual]) {
            agendaHospital[diaActual] = Array(6).fill({ nombre: '', edad: '', dni: '' });
        }

        let html = '';
        for (let i = 0; i < 6; i++) {
            let t = agendaHospital[diaActual][i] || { nombre: '', edad: '', dni: '' };
            html += `
                <div class="turno-box">
                    <strong>Turno ${i + 1}</strong>
                    <input type="text" value="${t.nombre}" readonly style="background:#eee;">
                    <div class="grid-turnos">
                        <input type="text" value="${t.edad}" readonly style="background:#eee;">
                        <input type="text" value="${t.dni}" readonly style="background:#eee;">
                    </div>
                </div>
            `;
        }
        cont.innerHTML = html;
    }

    function renderizarHistorialGen() {
        let cont = document.getElementById('lista-historial-gen');
        let pacientes = db.filter(x => x.ambito === ambitoActual);
        if (pacientes.length === 0) {
            cont.innerHTML = "<p style='color:#7f8c8d;'>No hay pacientes registrados en este ámbito.</p>";
            return;
        }
        cont.innerHTML = pacientes.map(p => `
            <div style="background:#fff; padding:10px; margin:5px 0; border-radius:5px; border:1px solid #ddd;">
                <h4>Paciente: ${p.nombre}</h4>
                ${(p.intervenciones || []).map(i => `<p>${i.tipo}: ${i.obs}</p>`).join('')}
            </div>
        `).join('');
    }

    window.exportarRespaldo = function() {
        let dataCompleta = { db, agendaHospital, listaEspera: listaEsperaData, exPacientes: exPacientesDb };
        let blob = new Blob([JSON.stringify(dataCompleta, null, 2)], { type: 'application/json' });
        let a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'Respaldo_Asistente_Psico.json';
        a.click();
    };

    window.cargarRespaldo = function(event) {
        let file = event.target.files[0];
        if (!file) return;
        let reader = new FileReader();
        reader.onload = function(e) {
            try {
                let data = JSON.parse(e.target.result);
                
                // Inspeccionamos qué estructura trae realmente el archivo
                console.log("Datos leídos del JSON:", data);

                db = data.db || data.items || data.pacientes || [];
                agendaHospital = data.agendaHospital || data.agenda || {};
                listaEsperaData = data.listaEspera || data.texto || '';
                exPacientesDb = data.exPacientes || data.ex || [];

                StorageService.guardarTodo();
                actualizarIndicadorEstado();
                
                alert(`¡Procesado con éxito!\n- Pacientes leídos: ${db.length}\n- Claves de agenda: ${Object.keys(agendaHospital).join(', ')}`);
                location.reload();
            } catch (err) {
                alert("Error al leer el archivo JSON: " + err.message);
            }
        };
        reader.readAsText(file);
    };
</script>
</body>
</html>
